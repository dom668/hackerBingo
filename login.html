<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="restricted/styles.css">
    
</head>
<body>

<div>
    <img src="restricted/logo.png" width="363px" height="200px"></img>

    <div class="box">
        <h2>Batwest Bank Login</h2>
        <p class="error" id="error" style="display:none">Wrong username or password.</p>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Log In</button>
    </div>
</div>


<script>
    const users = { alice: "password123", charlie: "qwertyidhggausgfuagdsjdsgforgfajkdsbglsdglui" };

    function login() {
        const u = document.getElementById("username").value;
        const p = document.getElementById("password").value;
        if (users[u] && users[u] === p) {
            window.location.href = "restricted/home.html?user=" + u + "&tier=silver";
        } else {
            document.getElementById("error").style.display = "block";
        }
    }
</script>
</body>
</html>
