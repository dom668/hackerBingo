<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tier</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <nav class="navbar">
    <div class="logo">
        <img src="logo.png" alt="Company Logo" width="150px" height="130px">
    </div>

    <ul class="nav-links">
        <div>
            <div class="button-div">
                <button onclick="homePage()" class="menu-button">Home</button>
            </div>
            <div class="button-div">
                <button onclick="tierPage()" class="menu-button">Tier Subcription</button>    
            </div>
        </div>
        
        <div>
            <div class="button-div">
                <button onclick="investorPage()" class="menu-button">Investor Info</button>    
            </div>
            <div class="button-div">
                <button onclick="feedbackPage()" class="menu-button">Feedback</button>    
            </div>
        </div>
        <div>
            <div class="button-div">
                <button onclick="searchPage()" class="menu-button">Search</button>    
            </div>
            <div class="button-div">
                <button onclick="admin()" class="menu-button">Admin</button>    
            </div>
        </div>
        
    </ul>
    </nav>

    <div class="vert-container">
        <div class="welcome">
            <h2 id="tier-display"></h2>
        </div>

        <div class="box">
            <h2>Enter your tier upgrade code</h2>
            <p class="error" id="error" style="display:none">Invalid Code</p>
            <input type="text" id="code" placeholder="Code">
            <button onclick="submit()">Submit</button>
        </div>
        <p class="error" id="sql" style="display:none">'users' table has been deleted</p>
    </div>
    

<script>
    
    const allowed = ["alice", "charlie"];
    const params = new URLSearchParams(window.location.search);
    const user = params.get("user");
    const tier = params.get("tier");

    if (!allowed.includes(user)) {
        window.location.href = "login.html";
    } else {
        document.getElementById("tier-display").textContent = "You are currently " + tier + " tier";
    }

    function submit() {
        const code = document.getElementById("code").value

        document.getElementById("error").style.display = "none";
        document.getElementById("sql").style.display = "none";

        if (code == "'; DROP TABLE users;--"){
            console.log(code)
            document.getElementById("sql").style.display = "block";
        } else {
            console.log(code)
            document.getElementById("error").style.display = "block";
        }
    }

    function homePage(){
        window.location.href = "home.html?user=" + user + "&tier=" + tier;
    }
    function tierPage(){
        window.location.href = "tier.html?user=" + user + "&tier=" + tier;
    }
    function investorPage(){
        window.location.href = "investor_info.html?user=" + user + "&tier=" + tier;
    }
    function feedbackPage(){
        window.location.href = "feedback.html?user=" + user + "&tier=" + tier;
    }
    function searchPage(){
        window.location.href = "search.html?user=" + user + "&tier=" + tier;
    }
    function admin(){
        window.location.href = "adminLogin.html?user=" + user + "&tier=" + tier;
    }
    
</script>
</body>
</html>
